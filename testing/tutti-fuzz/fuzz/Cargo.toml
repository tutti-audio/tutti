[package]
name = "tutti-fuzz-libfuzzer"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tutti-fuzz = { path = ".." }

# Its own workspace: cargo-fuzz builds it with the pinned nightly, apart from
# the root workspace.
[workspace]

[[bin]]
name = "wav_decode"
path = "fuzz_targets/wav_decode.rs"
test = false
doc = false
bench = false

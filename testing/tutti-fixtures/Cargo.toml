[package]
name = "tutti-fixtures"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Where the test suites find repo assets, the reference plugin cdylibs and the plugin-server binary, and a SoundFont built in memory"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tutti-audio/tutti"
publish = false

# A dev-dependency of the crates whose tests read a repo asset, load a
# reference plugin or the plugin-server, check a range-checked type, or build
# MIDI messages (`midi`). Without a feature it names `tutti-ump` and
# `tutti-midi-protocol`. Those two dev-depend on this crate for
# `check_range_contract`, so their tests link a second copy of them; they use
# nothing of `midi`, whose signatures name them. It never ships.
[dependencies]
tutti-ump = { path = "../../crates/tutti-ump", default-features = false }
# `MainThreadMarker`: the harness's token for a main-thread entry.
tutti-platform = { path = "../../crates/tutti-platform" }
# `Mint` (`unique`) and `SplitMix64` (`digest`).
# `tutti-rt` dev-depends on this crate, so its own tests link a second copy of it;
# they use neither `digest` nor `unique`, whose signatures name them.
tutti-rt = { path = "../../crates/tutti-rt" }
tutti-midi-protocol = { path = "../../crates/tutti-midi-protocol" }
# The units a signal helper takes (`Hz`, `Amplitude`, `SampleRate`, `Samples`).
# `tutti-units` dev-depends on this crate, so its own tests meet a second copy
# of it here: they use none of `signal`, whose signatures name its units.
tutti-units = { path = "../../crates/tutti-units" }
# The event rig's `ChannelLayout` and `MaxBlock`. `tutti-buffers` dev-depends on this
# crate too, so its own tests meet a second copy of it here: they use no event rig,
# whose signatures name its types.
tutti-buffers = { path = "../../crates/tutti-buffers" }
# `signal`'s float WAV, the independent reader and writer the codecs are
# checked against.
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `plugin`: what a plugin crate's tests share (`main_thread`). Only crates above
# `tutti-plugin-types` turn it on. In a workspace build the feature unifies, so
# a crate at or below it may link a second copy of itself through this one; no
# test there passes its own types into the `plugin` items, so the copies never
# meet.
tutti-plugin-types = { path = "../../crates/tutti-plugin-types", optional = true }
raw-window-handle = { version = "0.6", optional = true }
# `plugin`: the constant tempo a plugin node renders under (`tempo`).
tutti-timeline = { path = "../../crates/tutti-timeline", optional = true }
# `graph`: the capture sink and rig of the MIDI crates' tests (`event_rig`). Only
# crates above `tutti-graph` turn it on; in a workspace build the feature
# unifies, so `tutti-graph`'s own tests may link a second copy of it through this
# crate: none passes its own types into `event_rig`, so the copies never meet.
tutti-graph = { path = "../../crates/tutti-graph", optional = true }
# `vst3-cpp`: the C++ twin of the shared plugin, built by cargo in the same
# invocation; its `links` key hands the bundle directory to `build.rs`.
tutti-shared-plugin-vst3-cpp = { path = "../tutti-shared-plugin-vst3-cpp", optional = true }

# `vst3-sdk`: the SDK structs `sdk_zeroed` builds.
vst3 = { version = "0.3", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# `au`: the shared plugin's Audio Unit, registered in this process.
tutti-shared-plugin = { path = "../tutti-shared-plugin", optional = true }
coreaudio-sys = { version = "0.2", optional = true }

[features]
# `EventRig` and `Sink`: a graph that logs the MIDI its event inputs receive.
graph = ["dep:tutti-graph"]
# `au_bundle`, the bundle that declares the shared plugin's Audio Unit, and
# `element_name_retain_count` (macOS).
au = ["plugin", "dep:tutti-shared-plugin", "dep:coreaudio-sys"]
plugin = ["dep:tutti-plugin-types", "dep:raw-window-handle", "dep:tutti-timeline"]
# `vst3_cpp_module` and `bundle_of`: where the C++ twin is.
vst3-cpp = ["plugin", "dep:tutti-shared-plugin-vst3-cpp"]
# `sdk_zeroed`: an all-zero VST3 SDK record, for a test to fill in.
vst3-sdk = ["dep:vst3"]

[dev-dependencies]
# The lock test's private directory.
tempfile = "3"

[lints]
workspace = true

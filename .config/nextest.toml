# Every test fails by name once it runs five minutes: nextest reports it slow at
# each minute and terminates it at the fifth, so a hang ends the run with the
# test's name instead of holding a build slot for hours. The slowest healthy
# tests take under a minute on CI (a VST3 concurrent-open test about 50 s, the
# graph's crossfade property about 25 s, the CLAP live tests up to 17 s);
# five minutes leaves room for a loaded machine. Every profile inherits it.
[profile.default]
# A bench is `cargo bench`'s, never a test: a `harness = false` bench runs its
# timing loop when nextest asks it to list its tests, which fails the listing
# (`--all-targets`). `--ignore-default-filter` lists one on purpose.
default-filter = "not kind(bench)"
slow-timeout = { period = "60s", terminate-after = 5 }

# Opening and dropping one VST3 image from many threads takes about 50 s on CI's
# macOS runner, so it gets ten minutes.
[[profile.default.overrides]]
filter = 'package(tutti-vst3-host) and test(concurrent_opens_and_drops_of_one_image_do_not_corrupt_the_plugins_globals)'
slow-timeout = { period = "60s", terminate-after = 10 }

# A `tutti-rt` test that spins (a block counter that was not re-armed, a gate
# that never closes) fails after a minute instead of hanging the run. The
# longest healthy test in the crate takes a few seconds.
[[profile.default.overrides]]
filter = 'package(tutti-rt)'
slow-timeout = { period = "30s", terminate-after = 2 }

# The sequencer has 64 dynamic client slots, and each `tutti-midi-hardware`
# test against it holds two to four of them (the watch's, its devices'), one of
# them (the reused-number repro) for six seconds. Parallel copies of the suite,
# as CI runners and a developer's other builds make, ran out (`snd_seq_open`
# ENOMEM). At most four of these tests run at once in a copy.
[test-groups]
sequencer = { max-threads = 4 }
gs-synth = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(tutti-midi-hardware) and test(/backend::alsa::tests::/)'
test-group = 'sequencer'

# Windows' GS Wavetable Synth takes one client at a time: a second
# `midiOutOpen` while another test binary holds it fails (`MMSYSERR_ERROR`).
# The synth tests of every crate, and the output suite that opens it, run one
# at a time (the suite's ALSA arm joins the group too, at no cost).
[[profile.default.overrides]]
filter = 'test(/^synth_open::/) | (package(tutti-midi-hardware) & test(/^output::/))'
test-group = 'gs-synth'

# `cargo xtask conformance` joins each test's result to the spec rows it tags.
# CI runs the plugin test tiers with this profile and uploads the file per OS.
[profile.conformance.junit]
path = "junit.xml"
# The plugin contract prints a marker line for a declared gap; the report reads
# it from a passing case's output.
store-success-output = true

[package]
name = "tutti-coremidi-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Safe bindings to Apple's CoreMIDI for MIDI 2.0 virtual ports and device endpoints, for tutti"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["coremidi", "ump", "midi", "ffi"]
categories = ["external-ffi-bindings", "multimedia::audio", "os::macos-apis"]

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
coremidi-sys = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
block2 = { workspace = true }
core-foundation = { workspace = true }
mach2 = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSError"] }
objc2-core-midi = { workspace = true, features = ["block2", "MIDIUMPMutableEndpoint", "MIDIUMPMutableFunctionBlock"] }
# `Instant`, the one clock type.
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }

# The OS-free checks derive their errors on every target the tests run on.
[dev-dependencies]
thiserror = { workspace = true, features = ["std"] }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
# `Instant`, which the OS-free retry rules take as the `now` they are given.
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { workspace = true, features = ["NSDictionary"] }

# `UmpEndpoint` is a main-thread object: this target owns `main()`, which is the
# process's main thread under cargo (the default harness runs each test on a worker
# thread). `tutti_fixtures::main_thread_cases` answers nextest's command line.
[[test]]
name = "ump_endpoint"
path = "tests/ump_endpoint/main.rs"
harness = false

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]

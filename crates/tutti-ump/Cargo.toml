[package]
name = "tutti-ump"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MIDI 2.0's Universal MIDI Packet as Rust values, carrying both MIDI 1.0 and MIDI 2.0 messages"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["midi", "ump", "audio", "real-time"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# `Serialize`/`Deserialize` on every public value type a stored `Message` can
# contain, field newtypes included: a range-checked one reads back through its
# own check. `Ump`, the wire storage, is the one exception.
serde = ["dep:serde", "tutti-music/serde"]

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
tutti-units = { version = "0.0.1", path = "../tutti-units", default-features = false }
# `Normalized`'s scaling and `FlexTempo::from_bpm` round with `libm`'s pure-Rust `round`, so the result does not depend on the platform's C math library.
libm = "0.2.15"
tutti-music = { version = "0.0.1", path = "../tutti-music", default-features = false }
thiserror.workspace = true
# M2-104 section 1.8: a name is held in NFC. Pure Rust, no `std`.
unicode-normalization = { workspace = true }
serde = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
serde_json = "1"
assert_no_alloc = { version = "1", default-features = false }
criterion.workspace = true
proptest = "1.9.0"
tutti-fixtures = { path = "../../testing/tutti-fixtures" }

[[bench]]
name = "codec"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package]
name = "tutti-rt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Small data structures safe to use from an audio callback, which must never wait, allocate or lock"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "real-time", "lock-free"]
categories = ["multimedia::audio", "concurrency"]
# Not published: it carries the engine's `unsafe` (the denormals guard, the
# parallel executor's claims), and whether it is offered as a crate of its own
# is the maintainer's call. Its `unsafe` is listed in the README's "Safety".

[lints]
workspace = true

[features]
# Nothing on by default. Under `RTSAN_ENABLE` (see `cargo xtask rtsan`) each `RtScope`
# also holds LLVM's RealtimeSanitizer region on Linux and macOS; without that variable
# the dependency's functions are empty and it downloads nothing.
rtsan = ["dep:rtsan-standalone"]

[dependencies]
# `Param<U>` wraps an `Arc<AtomicF64>`.
atomic_float = { version = "1.1", default-features = false, features = ["atomic_f64"] }
# `Publisher`/`Loan`/`Reader`, re-exported at the root: the cell non-scalar state
# reaches the audio thread through. A general-purpose crate that names no tutti
# crate; it comes from crates.io.
arc-lend = "0.2.1"
# The byte views behind `SeqWriter<T>`: a `NoUninit +
# AnyBitPattern` value to and from its bytes with no `unsafe`.
bytemuck = { version = "1.16", features = ["derive"] }

# `PosRing`'s, `AtomicCell`'s, `SeqWriter`/`SeqReader`'s and `AudioThreadCell`'s
# atomics become loom's under `--cfg loom`, so the models in `tests/*_loom.rs`
# check the shipped protocols rather than replicas.
# Only that flag pulls this in; a normal build never sees loom.
#
#     cargo test -p tutti-rt --release --test pos_ring_loom   (with the loom cfg flag set)
#
# Nothing in this crate's dependency closure breaks under the flag. The one dependency that reacts to
# it, `arc-lend`, does so by the same design (its atomics become loom's too).
# The `Error` derive of the crate's error types.
thiserror = { workspace = true, features = ["std"] }
# `Instant`, the clock the waits and `BlockWaits` read (the web's `performance.now()` there).
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }
# The bells' tick yields to its drive between passes.
futures-lite.workspace = true
# `tracing::warn!` when the bells' tick task does not end at the drop.
tracing.workspace = true
# `Sample`, the formats `PosRing` is generic over, and `ChannelLayout`, the width it is written in.
tutti-buffers = { version = "0.0.1", path = "../tutti-buffers" }
# `Reading` for every `Unit`: a `Gauge<Db>` holds a unit, and the unit vocabulary is below this crate.
# `ranged!`, which writes `RequestFlag`.
tutti-units = { version = "0.0.1", path = "../tutti-units", default-features = false }

# `RtScope`'s sanitizer region (the `rtsan` feature): a runtime of libc interceptors that
# sees a C `malloc`, a pthread lock or file I/O inside a scope. Unix only, as the crate's
# runtime is.
[target.'cfg(unix)'.dependencies]
rtsan-standalone = { version = "=0.3.0", optional = true }

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
assert_no_alloc = { version = "1", default-features = false }
# `tests/request_flag.rs` checks `RequestFlag` with `check_range_contract`; an integration
# test links the one `tutti-rt` this crate builds, so the copies never meet.
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
# The position ring's gather bench.
criterion.workspace = true

# `tests/spin_starvation.rs` (an ignored probe) pins its threads to one core
# and sets their scheduling policy: `sched_setaffinity`, `pthread_setschedparam`.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[[bench]]
name = "pos_ring"
harness = false

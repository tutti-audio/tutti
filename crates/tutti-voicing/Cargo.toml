[package]
name = "tutti-voicing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Decides what a note-driven instrument does with each MIDI message: start, release, steal or bend a voice"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["midi", "audio", "synthesizer", "polyphony", "mpe"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
tutti-midi-protocol = { version = "0.0.1", path = "../tutti-midi-protocol" }
tutti-units = { version = "0.0.1", path = "../tutti-units", default-features = false }
# The portamento rate (`glide_rate`) and the registered-parameter words are
# `libm`'s pure-Rust `expf`/`logf`/`roundf`/`floorf`: the crate builds without
# `std`, and the render does not depend on the platform's libm.
libm = "0.2.15"
thiserror = { workspace = true }

[dev-dependencies]
assert_no_alloc = { version = "1", default-features = false }
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
tutti-rt = { version = "0.0.1", path = "../tutti-rt", default-features = false }

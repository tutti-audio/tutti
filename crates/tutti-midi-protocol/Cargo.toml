[package]
name = "tutti-midi-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Translates between MIDI 1.0 and MIDI 2.0 messages"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["midi", "ump", "audio", "real-time"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# serde for the values a project saves: `PitchBendSensitivity`, the MPE values, the
# time codes and frame rates, the translation modes and policies, and the tuning
# values. `Universal` and `MmcCommand` are wire data (a SysEx message is read from
# and written to bytes, never stored as a value), so they have no serde.
serde = ["dep:serde", "tutti-ump/serde"]

[dependencies]
tutti-units = { version = "0.0.1", path = "../tutti-units", default-features = false }
tutti-music = { version = "0.0.1", path = "../tutti-music", default-features = false }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
serde = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }
# Pure-Rust `round` and `floor`, which `core` lacks.
libm = "0.2.15"
winnow = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = "1"
tutti-midi-protocol = { path = ".", features = ["serde"] }
tutti-fixtures = { path = "../../testing/tutti-fixtures" }


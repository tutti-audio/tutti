[package]
name = "tutti-plugin-ipc-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The operating-system calls behind tutti's plugin helper process, wrapped in safe functions"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["audio", "plugin", "ipc", "shared-memory"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
# The mapping.
memmap2 = "0.9"
# The header's per-architecture cache-line padding.
crossbeam-utils = "0.8"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
# `poll`, `kill(pid, 0)` and `O_NOFOLLOW`, without a hand-written call.
rustix = { version = "1", default-features = false, features = ["std", "event", "process", "fs"] }

[target.'cfg(windows)'.dependencies]
# The process table walk and liveness probe, the named-pipe peek, and the
# slab file's delete-on-close open.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

# The header's atomics become loom's under the loom cfg flag, so
# `tests/header_loom.rs` models the shipped code. Only that flag pulls this in.
#
#     cargo test -p tutti-plugin-ipc-ffi --release --test header_loom   (with the loom cfg flag set)
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[[test]]
name = "header_loom"
path = "tests/header_loom.rs"

[package]
name = "tutti-plugin-ipc-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The operating-system calls behind tutti's plugin helper process, wrapped in safe functions"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["audio", "plugin", "ipc", "shared-memory"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
# The mapping.
memmap2 = "0.9"
# The header's per-architecture cache-line padding.
crossbeam-utils = "0.8"
thiserror = "2"
# The slab's wire form crosses the control wire; the slab's fresh name.
serde = { version = "1", features = ["derive"] }
getrandom = { workspace = true }
# `spawn_named`: the host-watch thread; `Instant`, the one clock type.
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }

[target.'cfg(unix)'.dependencies]
# `poll`, `kill(pid, 0)`, the slab's memfd and seals, and the descriptor's
# `sendmsg`/`recvmsg`, without a hand-written call.
rustix = { version = "1", default-features = false, features = ["std", "event", "process", "fs", "net"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The slab's POSIX shared memory object.
rustix = { version = "1", default-features = false, features = ["shm"] }

[target.'cfg(windows)'.dependencies]
# The process table walk and liveness probe, the named-pipe peek, and the
# slab file's delete-on-close open.
windows-sys = { workspace = true, features = [
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
] }

# The header's atomics become loom's under the loom cfg flag, so the
# `loom_model` unit module in `src/header.rs` models the shipped code. Only that
# flag pulls this in.
#
#     cargo test -p tutti-plugin-ipc-ffi --release --lib loom_model   (with the loom cfg flag set)
[target.'cfg(loom)'.dependencies]
loom = "0.7"

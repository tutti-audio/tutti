[package]
name = "tutti-sampler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Plays recorded audio from memory or disk, with looping, speed changes and pitch-keeping time stretch"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "sampler", "time-stretch", "streaming", "dsp"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []

# `serde` for `StreamStart` (a range-checked position: it serialises as the bare
# `f64` and refuses what `StreamStart::new` refuses). Off by default; the crate's
# own dev-dependency turns it on so its contract test runs under a plain
# `cargo nextest run`.
serde = ["dep:serde"]

# Drive the streamer's cycle by hand instead of by its thread.
#
# Exposes `DiskStreamer::manual` + `step`, which run the *same*
# `StreamerCycle::step` the streamer thread runs. Also exposes `testing`: a transport a
# test moves between blocks, and the
# block driver that hands a node its `Env` (which needs `tutti-graph`'s
# `contract` harness).
testing = ["tutti-graph/contract"]

[dependencies]
# The file edge: `Wave` (the resident buffer a voice plays), and with a
# `tutti-codec` decode feature the decoder the streamer loads and streams
# through (`read_wave`, `read_wave_metadata`, `FileIn`).
tutti-codec = { version = "0.0.1", path = "../tutti-codec" }

# The graph: every node here is a `tutti_graph::Node`, reads
# the transport from its block's `Env`, and hands its controls and its fork
# source over through `IntoNode`.
tutti-graph = { version = "0.0.1", path = "../tutti-graph" }

tutti-buffers = { version = "0.0.1", path = "../tutti-buffers" }
tutti-units = { version = "0.0.1", path = "../tutti-units", default-features = false }
tutti-music = { version = "0.0.1", path = "../tutti-music", default-features = false }

# The project's tempo map, and the reader a placed voice lends it through: over
# a map that changes, how long the playhead took from a clip's start to now is
# the map's, not the current tempo's.
tutti-tempo = { version = "0.0.1", path = "../tutti-tempo" }
# `spawn_named`, `PriorityRequest`: the disk streamer's thread.
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }
# The streamer task yields to its drive between cycles.
futures-lite.workspace = true
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }

# `PhaseVocoder`: the time stretch and pitch shift of a voice that stretches.
tutti-dsp = { version = "0.0.1", path = "../tutti-dsp", default-features = false }

thiserror = { workspace = true, features = ["std"] }
tracing.workspace = true
serde = { version = "1", optional = true, features = ["derive"] }

# Parallel I/O
rayon = "1.10"


# `AtomicF64`, for the streamer's shared cells.
atomic_float = "1.1"

[dev-dependencies]
# The graph-clock tests drive a transport over the sampler's voices.
tutti-timeline = { path = "../tutti-timeline" }
# Finds the repo's `assets/` for the tests.
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
criterion.workspace = true
# The crate's own `testing` surface, for the integration tests.
#
# A dev-dependency on self is how a feature reaches `tests/` unconditionally:
# `required-features` on the test target would skip `tier_parity` when the
# feature is off, and a plain `cargo nextest run` would report green without it.
tutti-sampler = { path = ".", features = ["testing", "serde"] }
# The decoders the tests open files with.
tutti-codec = { path = "../tutti-codec", features = ["decode-wav", "decode-flac", "decode-mp3"] }
# Stimulus nodes (`tutti_nodes::testing`).
tutti-nodes = { path = "../tutti-nodes", default-features = false, features = ["testing"] }
# `contract` for the node harnesses (`drive_input`, `Direct`, `BlockRig`).
tutti-graph = { path = "../tutti-graph", features = ["contract", "testing"] }
# The engine the clock tests render through.
tutti-engine = { path = "../tutti-engine" }
# `ControlProgram`, for a control lane on a voice's gain port
# (`voice_gain_survives_commit.rs`).
tutti-modulation = { path = "../tutti-modulation", default-features = false }

tempfile = "3.8"
assert_no_alloc = { version = "1", default-features = false }

# Tests only: several fixtures write a real WAV to disk and stream it back, so
# they need a writer. The library itself does not touch `hound` (the live file
# sink is `tutti-codec`'s `EncoderSink`).
hound = "3.5"

[[bench]]
name = "voice_pool"
harness = false

[[bench]]
name = "ring_read"
harness = false

[[bench]]
name = "stretch"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package]
name = "tutti-music"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Musical vocabulary for audio code: notes, time signatures and meter maps, loop ranges, the frame clock and the ADSR stages"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "music", "midi", "real-time"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# Enables `Serialize`/`Deserialize` on the values a document or a wire carries:
# `Note` and the meter vocabulary (`TimeSignature`, `MeterChange`, `MeterMap`),
# with the unit newtypes they are built from. Not `LoopRange` or `Adsr`.
serde = ["dep:serde", "tutti-units/serde"]

[dependencies]
# `FrameClock`, `Note` and the meter round and ceil through `libm`'s pure-Rust
# functions, so they do not depend on the platform's C math library.
libm = "0.2.15"
# The unit newtypes every value here is built from.
tutti-units = { version = "0.0.1", path = "../tutti-units" }
serde = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }
# The `Error` derive of the crate's error types.
thiserror = { workspace = true }

[dev-dependencies]
# The meter `Deserialize` impls are the untrusted-document edge, so they are
# tested against a real format rather than a hand-rolled deserializer.
serde_json = "1"
tutti-fixtures = { path = "../../testing/tutti-fixtures" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

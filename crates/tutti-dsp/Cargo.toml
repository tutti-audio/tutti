[package]
name = "tutti-dsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Audio signal-processing algorithms over tutti-buffers views: filters, dynamics, delay, reverb, convolution, resampling and a CPU-independent FFT"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "dsp", "fft", "filter", "reverb"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
tutti-buffers = { version = "0.0.1", path = "../tutti-buffers" }
# `SplitMix64`, the one pseudo-random generator, behind the dither and noise sources.
tutti-rt = { version = "0.0.1", path = "../tutti-rt", default-features = false }
# The unit vocabulary (Hz / Seconds / Samples / Amplitude / Confidence / …),
# `ChannelLayout`, `Interleaved` and the downmix helpers. Nothing here needs
# the engine runtime, so these are the only tutti edges.
tutti-units = { version = "0.0.1", path = "../tutti-units", default-features = false }
# `NoteDuration`, the length of a tempo-synced delay time.
tutti-music = { version = "0.0.1", path = "../tutti-music", default-features = false }

# `RealFft` (`fft/real.rs`), the one real-input FFT of the convolver, the
# analyzers in `tutti-measure`, the time-stretch vocoder, the HRTF panner and the export
# resampler, planned on rustfft's *scalar* planner. Its auto planner (and so
# `realfft`, which cannot be handed another) picks AVX, SSE or NEON at run
# time, and those round differently, so a render would differ bitwise between
# CPUs. Same version as `Cargo.lock`'s.
rustfft = { version = "6.4", default-features = false }

# The filters' models call `libm`'s pure-Rust transcendentals (the crossover's `tan`), so results do not depend on the platform's C math library.
libm = "0.2.15"

# `f32x8`, so the filter steps written over `SimdLanes` run eight voices of the
# polysynth's lane bank at a time (`filter/simd_lanes.rs`). Same version as `Cargo.lock`'s.
wide = { version = "1.6", default-features = false }

# The `Error` enum's Display/Error impls.
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
# `check_range_contract` for the range-checked types.
tutti-fixtures = { path = "../../testing/tutti-fixtures" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package]
name = "tutti-midi-network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Network MIDI 2.0 over UDP: the wire format, the Client and Host session machines, and mDNS discovery"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["midi", "network", "udp", "audio", "mdns"]
categories = ["multimedia::audio", "network-programming"]

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
getrandom = { workspace = true }
mdns-sd = { workspace = true }
# `Stream`: `Browser` and a link's `NetworkEvents` are ones.
futures-core = { workspace = true }
tutti-units = { version = "0.0.1", path = "../tutti-units", default-features = false }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
# `Instant`, the one clock type, and the `Executor` the socket task runs on.
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }
# `Mutex`, the lock that refuses a wait inside a render.
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }

[dev-dependencies]
proptest = "1.9.0"
futures-lite = { workspace = true }
tutti-fixtures = { path = "../../testing/tutti-fixtures" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

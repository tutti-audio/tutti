[package]
name = "tutti-buffers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Audio sample formats and borrowed buffer views: mono, interleaved and planar, with spec'd conversions between formats and layouts"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["audio", "buffer", "sample", "interleaved"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
# `serde` for `I24` (its `i32`, refused outside the 24-bit range) and for the wire-carried
# channel types: `ChannelLayout`, `ChannelTopology` and `MaxBlock`, with `tutti-units`' `serde`.
serde = ["dep:serde", "tutti-units/serde"]

[dependencies]
# `Samples`, the frame count every view speaks, and `ranged!`, the range-checked widths.
tutti-units = { version = "0.0.1", path = "../tutti-units", default-features = false }
# Pure-Rust `rint`, `sqrt`, `exp` and kin, so a conversion or a `Float`'s math does
# not depend on the platform's C math library.
libm = "0.2.15"
# The `Error` derive of `BufferError` and `I24OutOfRange`.
thiserror = { workspace = true }
# `Float` is `Pod`: the engine's arena casts lines of it to slices.
bytemuck = { version = "1.16", default-features = false }
# `Serialize` and `Deserialize` of the wire types, behind the `serde` feature.
serde = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
# The fold's allocation gate: the test binary installs `AllocDisabler`.
assert_no_alloc = { version = "1", default-features = false }
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
# The `serde` feature's round trip.
serde_json = "1"
# The conversion bench.
criterion.workspace = true

[[bench]]
name = "convert"
harness = false

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

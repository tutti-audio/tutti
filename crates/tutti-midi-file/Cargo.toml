[package]
name = "tutti-midi-file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Reads and writes Standard MIDI Files and MIDI 2.0 Clip Files"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["midi", "smf", "audio", "codec"]
categories = ["multimedia::audio", "parser-implementations"]

[lints]
workspace = true

[dependencies]
tempfile = "3.27"
thiserror = { workspace = true, features = ["std"] }

tutti-midi-ci = { version = "0.0.1", path = "../tutti-midi-ci" }
tutti-midi-protocol = { version = "0.0.1", path = "../tutti-midi-protocol" }

tutti-music = { version = "0.0.1", path = "../tutti-music" }
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }
tutti-tempo = { version = "0.0.1", path = "../tutti-tempo" }
tutti-units = { version = "0.0.1", path = "../tutti-units", default-features = false }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
winnow = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
tutti-fixtures = { path = "../../testing/tutti-fixtures" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

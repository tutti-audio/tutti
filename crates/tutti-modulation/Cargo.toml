[package]
name = "tutti-modulation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Describes how LFOs, envelopes and other sources drive settings, and works out what each setting does"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "modulation", "lfo"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
# `Law`, the project's response-curve vocabulary, and the automation trajectory
# that is a `Curve`.
tutti-curve = { version = "0.0.1", path = "../tutti-curve" }

# The value vocabulary: `Depth`, `Beat`, `PhaseIncrement`, `ParamAddr` (a
# target's param), `PlayReading`.
tutti-units = { version = "0.0.1", path = "../tutti-units", default-features = false }
tutti-music = { version = "0.0.1", path = "../tutti-music", default-features = false }

# The MIDI a note envelope hears (`Ump`, its held `Key`). Layer 0.
tutti-ump = { version = "0.0.1", path = "../tutti-ump" }
# `Param<Depth>`, the cell a route's depth lives in. Layer 1.
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
# `floor` of the program's phase and beat maths.
libm = "0.2.15"
# The `Error` derive of the crate's error types.
thiserror = { workspace = true }


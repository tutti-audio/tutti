[package]
name = "tutti-winmm-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Safe bindings to the Windows Multimedia MIDI API (winmm), for tutti"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["winmm", "midi", "windows", "ffi"]
categories = ["external-ffi-bindings", "multimedia::audio", "os::windows-apis"]

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
thiserror = { workspace = true, features = ["std"] }
tracing.workspace = true
windows-sys = { workspace = true, features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Foundation",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_System_Threading",
] }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
# `Instant`, the one clock type.
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }

# The protocol's atomics and lock become loom's under the loom cfg flag, so the
# `loom_model` unit module in `src/lifetime.rs` models the shipped code. Only
# that flag pulls this in.
#
#     cargo test -p tutti-winmm-ffi --release --lib loom_model   (with the loom cfg flag set)
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[features]
# The suites that open Windows' GS Wavetable Synth, which needs an audio
# endpoint.
synth-tests = []

# The packing and stamp tests in `src/ump.rs` run on every target.
[dev-dependencies]
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }

[target.'cfg(windows)'.dev-dependencies]
tutti-fixtures = { path = "../../testing/tutti-fixtures" }

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]

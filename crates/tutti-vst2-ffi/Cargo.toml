[package]
name = "tutti-vst2-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
resolver = "2"
description = "Low-level VST 2.4 hosting bindings for tutti"
readme = "README.md"
keywords = ["vst", "vst2", "plugin"]
license = "MIT"
repository = "https://github.com/tutti-audio/tutti"
categories = ["multimedia::audio", "external-ffi-bindings"]

[features]
# `PluginEvents::for_test`: a view of a crafted event list, for the host crate's tests. Off in
# a production build.
testing = []

[dependencies]
bitflags = "2"
libloading.workspace = true
thiserror = { workspace = true, features = ["std"] }
tracing.workspace = true
num-traits = "0.2"
crossbeam-queue = { version = "0.3", default-features = false, features = ["alloc"] }
tutti-buffers = { version = "0.0.1", path = "../tutti-buffers" }
tutti-graph = { version = "0.0.1", path = "../tutti-graph" }
tutti-midi-protocol = { version = "0.0.1", path = "../tutti-midi-protocol" }
tutti-plugin-types = { version = "0.0.1", path = "../tutti-plugin-types" }
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }

[dev-dependencies]
# The test messages (`tutti_fixtures::midi`).
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
# Test-only global allocator: the grown-pins refusal must not allocate.
assert_no_alloc = { version = "1", default-features = false }

[lints]
workspace = true

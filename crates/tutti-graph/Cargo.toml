[package]
name = "tutti-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "An audio graph you can change while it plays: add processors, connect them, render block by block"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["audio", "real-time", "dsp"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# The sample-accuracy contract suite's harness, `tutti_graph::contract`:
# test support, so off by default. This crate's own
# tests turn it on through the self dev-dependency below; a node crate adding
# rows turns it on in its dev-dependency on this crate.
contract = ["dep:libm"]
# `Reference`, the naive interpreter the differential suites compare the
# executor with: test support (about 2,700 lines), so off by default. This
# crate's own tests turn it on through the self dev-dependency below.
testing = []
# `Serialize` and `Deserialize` on `RenderMode`, which a plugin's IPC carries.
serde = ["dep:serde"]

[dependencies]
tutti-buffers = { version = "0.0.1", path = "../tutti-buffers" }
# The value (`Topology`, `NodeKey`, ports), the unit newtypes and the latency /
# tail vocabulary.
tutti-units = { version = "0.0.1", path = "../tutti-units" }
tutti-music = { version = "0.0.1", path = "../tutti-music" }
atomic_float = "1.1"
# `with_no_denormals`, `Scheduling`: the render guard and the pool's helpers' priority.
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
# `Law`, the closed set of easings a param segment and a ramp move along.
tutti-curve = { version = "0.0.1", path = "../tutti-curve" }
# `Ump`, the packet an event carries, and its note-off test. No other tutti
# crate and no codec: this is why the packet is not in `tutti-units`.
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
# Safe casts between the 64-byte-aligned arena lines and the sample slices a
# node is handed. This is what keeps the executor free of `unsafe`: alignment
# comes from the element type, the reinterpretation from a checked `Pod` cast,
# and the disjoint borrows from `split_at_mut`. See `src/arena.rs`.
bytemuck = { version = "1.16", features = ["derive"] }
# `contract` only: the stimulus's sine is `libm`'s, so the snapshot does not
# depend on the platform's C math library.
libm = { version = "0.2.15", optional = true }
# `RenderMode`'s wire form, with `serde`.
serde = { version = "1", features = ["derive"], optional = true }
# The `Error` derive of the crate's error types.
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
# Turns `contract` and `testing` on for this crate's own tests (the pattern
# `tutti-nodes` uses for `testing`).
tutti-graph = { path = ".", features = ["contract", "testing"] }
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
assert_no_alloc = { version = "1", default-features = false }
criterion.workspace = true
# The benches' sine oscillator.
libm = "0.2.15"
proptest = "1.9.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[[bench]]
name = "graph_render"
harness = false

[[bench]]
name = "event_path"
harness = false

[[bench]]
name = "event_merge"
harness = false

[[bench]]
name = "held_keys"
harness = false

[[bench]]
name = "tap_lanes"
harness = false

[package.metadata.docs.rs]
features = ["contract"]
rustdoc-args = ["--cfg", "docsrs"]

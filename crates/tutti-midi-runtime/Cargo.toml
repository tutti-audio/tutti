[package]
name = "tutti-midi-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Carries MIDI through tutti's audio graph: device input, clips, clock and timecode sync, and MPE"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "midi", "real-time", "daw"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
# The graph's node contract and event ports: `MidiClipNode` is an event
# source node. No cycle: tutti-graph names no MIDI crate.
tutti-graph = { version = "0.0.1", path = "../tutti-graph" }

thiserror = { workspace = true, features = ["std"] }
tutti-buffers = { version = "0.0.1", path = "../tutti-buffers" }
tutti-units = { version = "0.0.1", path = "../tutti-units", default-features = false }
tutti-music = { version = "0.0.1", path = "../tutti-music", default-features = false }
atomic_float = "1.1"
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
tutti-midi-device = { version = "0.0.1", path = "../tutti-midi-device" }
tutti-midi-ci = { version = "0.0.1", path = "../tutti-midi-ci" }
tutti-midi-protocol = { version = "0.0.1", path = "../tutti-midi-protocol" }
# `Instant`, the one clock type.
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }

[dev-dependencies]
# The clock tests' shared beat.
atomic_float = "1.1"
# `check_range_contract` for `OutputOffset`, whose serde shape the test writes
# (`Seconds` serialises under `tutti-units`' `serde`).
serde = "1"
tutti-units = { path = "../tutti-units", default-features = false, features = ["serde"] }
tutti-music = { path = "../tutti-music", default-features = false, features = ["serde"] }
# The graph's by-hand node driver, `tutti_graph::contract::Direct`.
tutti-graph = { path = "../tutti-graph", features = ["contract"] }
assert_no_alloc = { version = "1", default-features = false }
criterion.workspace = true
tutti-fixtures = { path = "../../testing/tutti-fixtures", features = ["graph"] }
# `tests/clock_tempo_map.rs` renders the clock through the live engine over a
# published `TempoMap`. Dev edges only: nothing here depends on the engine.
tutti-engine = { path = "../tutti-engine" }
tutti-timeline = { path = "../tutti-timeline" }
tutti-tempo = { path = "../tutti-tempo" }

[[bench]]
name = "clip_node"
harness = false

[[bench]]
name = "input_node"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

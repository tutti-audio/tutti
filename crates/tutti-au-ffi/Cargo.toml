[package]
name = "tutti-au-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Safe bindings to Apple's AudioToolbox for hosting Audio Unit plugins, for tutti"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio-unit", "au", "audio", "plugin", "ffi"]
categories = ["multimedia::audio", "os::macos-apis"]

[lints]
workspace = true

[features]
# The hooks a test uses to reach what the safe API hides: the raw
# `AudioUnit` behind a `Unit`, and the raw packet-list walkers. Off in a
# production build; the host crate's tests turn it on.
testing = []

[target.'cfg(target_os = "macos")'.dependencies]
# The derive of every error type's `Display` and `Error`.
thiserror = { workspace = true, features = ["std"] }
# The block views (`Planes`, `PlanesMut`) a render converts to and from the AU's f32.
tutti-buffers = { version = "0.0.1", path = "../tutti-buffers" }
# `Bpm`, `Beat` on the host transport figures.
tutti-units = { version = "0.0.1", path = "../tutti-units", default-features = false }
# `Midi1Parser`, which reads a plugin's MIDI 1.0 output.
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
# The editor's sizes, which name their unit (`dpi::LogicalSize`: a Cocoa view is in points).
dpi.workspace = true
# The MIDI 2.0 widening of what a plugin emits.
tutti-midi-protocol = { version = "0.0.1", path = "../tutti-midi-protocol" }
# `RenderCount`: the renders in flight, which a MIDI-output withdrawal checks
# before it frees what the AU's callback reads.
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
# `WindowHandle` (the parent window of an editor), `TransportInfo` and
# `WireMidi`: the values the AU surface is spoken in.
tutti-plugin-types = { version = "0.0.1", path = "../tutti-plugin-types" }
core-foundation = "0.10"
core-foundation-sys = "0.8"
coreaudio-sys = "0.2"
# `relax-void-encoding`: the AU Cocoa view factory protocol takes the unit as
# `AudioUnit`, an opaque pointer each plugin SDK binds under its own struct name
# (`ComponentInstanceRecord` from JUCE, `OpaqueAudioComponentInstance` from
# Apple's own view factories). objc2's debug-build encoding check compares what
# we send against the *plugin's* declared signature, so no single Rust type can
# satisfy every plugin. This feature lets `*mut c_void` stand in for any
# pointer, which is the case objc2 documents it for. It relaxes only pointer
# identity at the top level; arity, scalar types and struct layouts are still
# verified. See `cocoa.rs`.
objc2 = { version = "0.6", features = ["relax-void-encoding"] }
# `AUEventListenerCreateWithDispatchQueue` takes an Objective-C *block*, not a
# function pointer, and it is the only listener constructor that works without a
# running CFRunLoop (see `listener.rs`).
block2 = { workspace = true }
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSString", "NSGeometry", "NSObject"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# `MIDIEventListInit` and `MIDIEventListAdd`, the layout `event_list` is checked against.
coremidi-sys = { workspace = true }

[dev-dependencies]
assert_no_alloc = { version = "1", default-features = false }
tutti-fixtures = { path = "../../testing/tutti-fixtures" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

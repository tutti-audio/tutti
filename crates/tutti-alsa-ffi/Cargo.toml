[package]
name = "tutti-alsa-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Safe bindings to the Linux ALSA sequencer and its MIDI 2.0 (UMP) interface, for tutti"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["alsa", "ump", "midi", "ffi"]
categories = ["external-ffi-bindings", "multimedia::audio", "os::linux-apis"]
links = "asound"

[lints]
workspace = true

[features]
# Hidden hooks for a test's fake peer: a legacy client and its events, a rename,
# a change of a port's capabilities, and the client's id.
testing = []

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
thiserror = { workspace = true, features = ["std"] }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[package]
name = "tutti-measure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Measures audio: loudness (EBU R128), pitch, onsets, stereo correlation, spectra, tempo, key and chords"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "analysis", "pitch", "loudness", "onset"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
tutti-buffers = { version = "0.0.1", path = "../tutti-buffers" }
# The unit vocabulary (Hz / Seconds / Samples / Amplitude / Confidence / …),
# `ChannelLayout`, `Interleaved` and the downmix helpers.
tutti-units = { version = "0.0.1", path = "../tutti-units", default-features = false }
tutti-music = { version = "0.0.1", path = "../tutti-music", default-features = false }

# `RealFft`/`FftScratch` (the CPU-independent real FFT every kernel here runs
# on), `Complex`, `StftGeometry`, `Grid` and the `Error` they share with the
# sampler's vocoder.
tutti-dsp = { version = "0.0.1", path = "../tutti-dsp", default-features = false }

# Pure-Rust transcendentals, so a reading does not depend on the platform's C
# math library.
libm = "0.2.15"

# EBU R128 loudness metering (`loudness`). An online meter, which is why the
# streaming Config/State/step shape fits it without buffering the signal.
ebur128 = "0.1"

# The `Error` enum's Display/Error impls.
thiserror = { workspace = true, features = ["std"] }

# `PeakBlocks` and `PeakBlock` stored in whatever format the app picks.
serde = { version = "1", optional = true, features = ["derive"] }

[features]
default = []
# Serialize/Deserialize for `PeakBlocks` and `PeakBlock`.
serde = ["dep:serde", "tutti-buffers/serde", "tutti-units/serde"]

[dev-dependencies]
# The README's "Reading from a running graph" doctest shows the engine-side
# seam (a graph tap's `TapReader`); nothing in the library reaches tutti-graph.
tutti-graph = { path = "../tutti-graph" }
# The one seeded generator: noise for the tests and the FFT bench.
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
# The shared sine, impulse and level readings (`signal`), and
# `check_range_contract` for the range-checked settings.
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
tutti-ump = { path = "../tutti-ump", default-features = false }
# The serde round trips of `PeakBlocks` and the range-checked settings in the
# `serde` feature's tests; `float_roundtrip` parses a float back exactly, so a
# bound one ulp inside its range reads back inside it.
serde_json = { version = "1", features = ["float_roundtrip"] }
# `benches/fft_analyses`.
criterion.workspace = true

[[bench]]
name = "fft_analyses"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

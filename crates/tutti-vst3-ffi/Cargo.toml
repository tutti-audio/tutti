[package]
name = "tutti-vst3-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Safe bindings for hosting VST3 plugins, built on the vst3 crate, for tutti"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["vst3", "audio", "plugin", "ffi"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
# Exposes the run loop's activity counters (`RunLoopActivity`), which the
# host-conformance tests read. Off in a production build; the host's
# `conformance` feature turns it on.
conformance = []

[dependencies]
# The editor's sizes, which name their unit (`dpi::Size`).
dpi.workspace = true
libloading.workspace = true
thiserror = { workspace = true, features = ["std"] }
tracing.workspace = true
crossbeam-queue = "0.3"
arrayvec = "0.7"
bitflags = "2"
tutti-plugin-types = { version = "0.0.1", path = "../tutti-plugin-types" }
# `Offset`: where a parameter point sits in its block.
tutti-graph = { version = "0.0.1", path = "../tutti-graph" }
tutti-units = { version = "0.0.1", path = "../tutti-units" }
tutti-music = { version = "0.0.1", path = "../tutti-music" }
tutti-buffers = { version = "0.0.1", path = "../tutti-buffers" }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
vst3 = "0.3"
# The Linux `IRunLoop` polls the descriptors a plugin registered; the run loop's
# typed values (`Ready`, `Interest`, `FdId`) are named on every platform.
tutti-plugin-ipc-ffi = { version = "0.0.1", path = "../tutti-plugin-ipc-ffi" }
# `Instant`, the one clock type.
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }

# The VST3 macOS module entry point is `bundleEntry(CFBundleRef)`, so building a
# CFBundleRef for the `.vst3` bundle needs CoreFoundation. macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

[dev-dependencies]
# `at_frame` and `unit_value`: the parameter points the tests build.
tutti-plugin-types = { path = "../tutti-plugin-types", features = ["testing"] }
assert_no_alloc = { version = "1", default-features = false }
# `main_thread`: the token a test passes where an entry wants the main thread.
tutti-fixtures = { path = "../../testing/tutti-fixtures" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

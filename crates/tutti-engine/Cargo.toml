[package]
name = "tutti-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Renders tutti's audio graph block by block, together with a playback clock"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "dsp", "real-time", "daw"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true, features = ["std"] }
tutti-buffers = { version = "0.0.1", path = "../tutti-buffers" }
tutti-units = { version = "0.0.1", path = "../tutti-units" }
tutti-music = { version = "0.0.1", path = "../tutti-music" }
# `monotonic_ns`, `sleep_until_ns`, `spawn_named`, `request_priority`, `with_no_denormals`: the clock, the pacing threads and their priority.
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
bytemuck = { version = "1.16", features = ["derive", "min_const_generics"] }
# `Engine` renders a `tutti_graph::Executor`.
tutti-graph = { version = "0.0.1", path = "../tutti-graph" }
tutti-transport = { version = "0.0.1", path = "../tutti-transport" }

[dev-dependencies]
# The same crate as the dependency above, with the sample-accuracy contract
# harness on (`tests/render/graph_contract.rs`): its `ImpulseSource` and
# `Latent` nodes are the engine-level rows' sources.
tutti-graph = { version = "0.0.1", path = "../tutti-graph", features = ["contract"] }
assert_no_alloc = { version = "1", default-features = false }
# `TempoMap`, for the step-map tests.
tutti-tempo = { path = "../tutti-tempo" }
tutti-ump = { path = "../tutti-ump", default-features = false }
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
# The metronome node (`ClickNode`) the engine-level tests render.
tutti-nodes = { path = "../tutti-nodes", default-features = false, features = ["testing"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package]
name = "tutti-plugin-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "How tutti talks to its plugin helper process"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["audio", "plugin", "ipc", "sandbox"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
# The client's test-only knobs and counters (a shortened rate wait, the replies
# it settled), for `tutti-plugin`'s tests, which turn it on through their
# dev-dependency. Never on in a shipping build.
testing = []

[dependencies]
# The editor's sizes, which name their unit (`dpi::Size`); they cross the wire serialized.
dpi = { workspace = true, features = ["serde"] }
tutti-units = { version = "0.0.1", path = "../tutti-units" }
tutti-music = { version = "0.0.1", path = "../tutti-music" }
# `Executor`, `PriorityRequest`: the client's audio and control lanes.
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }
# The audio and guard tasks yield to their drive between slices.
futures-lite.workspace = true
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
tutti-plugin-types = { version = "0.0.1", path = "../tutti-plugin-types", features = ["serde", "probe-wire"] }
# The sample width of a slab region (`Float`) and the block views the tests build.
tutti-buffers = { version = "0.0.1", path = "../tutti-buffers", features = ["serde"] }
# The shared mapping and the OS calls, behind safe calls.
tutti-plugin-ipc-ffi = { version = "0.0.1", path = "../tutti-plugin-ipc-ffi" }

# The wire.
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }

# The slab's sample views (`Pod`), so no `unsafe` byte cast of our own.
bytemuck = "1"
# Unpredictable slab and socket names (pure Rust; the OS's random source).
getrandom = { workspace = true }

crossbeam-queue = "0.3"
parking_lot = "0.13"

# Cross-platform local IPC (Unix sockets on Unix, named pipes on Windows).
interprocess = { version = "2" }

thiserror = "2"
tracing.workspace = true

[dev-dependencies]
# The plugin handle the served-handle tests drive over the mock server. Not a
# dependency: a format host knows no hosting, and the handle is `tutti-plugin-host`'s.
tutti-plugin-host = { path = "../tutti-plugin-host" }
tutti-midi-protocol = { path = "../tutti-midi-protocol" }
tutti-graph = { path = "../tutti-graph" }
tempfile = "3"
tutti-fixtures = { path = "../../testing/tutti-fixtures", features = ["plugin"] }
assert_no_alloc = { version = "1", default-features = false }
# The reference CLAP plugin the launch tests serve: a dev-dependency for the
# artifact, which cargo builds beside the test binary.
tutti-clap-test-plugin = { path = "../../testing/tutti-clap-test-plugin" }

[target.'cfg(unix)'.dev-dependencies]
# Reaps a server's process behind its guard's back (the exit status then cannot be read).
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }

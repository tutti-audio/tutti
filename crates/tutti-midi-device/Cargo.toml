[package]
name = "tutti-midi-device"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Keeps track of MIDI devices and the UMP Endpoints they declare"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["midi", "audio", "hot-plug"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# `Serialize`/`Deserialize` on the values an app stores: `MidiDeviceId`, `DeviceInfo`, `OsEndpointIdentity`,
# `SavedDevice`, `Learned`, `Endpoint`, `FunctionBlock`, `MidiIdentity`, `Capabilities` and
# `Supports`; a checked type reads back through its check.
serde = ["dep:serde", "tutti-ump/serde", "tutti-midi-ci/serde"]

[dependencies]
bitflags = "2"
thiserror = { workspace = true, features = ["std"] }
tutti-units = { version = "0.0.1", path = "../tutti-units", default-features = false }
tutti-midi-ci = { version = "0.0.1", path = "../tutti-midi-ci", default-features = false }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
serde = { version = "1", optional = true, features = ["derive"] }
# `Instant`, the one clock type.
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }

[dev-dependencies]
proptest = "1.9.0"
serde_json = "1"
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
tutti-rt = { path = "../tutti-rt" }

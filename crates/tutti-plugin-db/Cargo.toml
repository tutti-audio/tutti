[package]
name = "tutti-plugin-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Finds the audio plugins installed on a machine and remembers them"
license.workspace = true
repository.workspace = true
readme = "README.md"
# Not published: whether and when this goes to crates.io is the maintainer's
# call, not a side effect of a workspace change. Remove this line to publish.
keywords = ["audio", "plugin", "vst3", "clap", "discovery"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# `PluginDb` derives `Serialize` and `Deserialize`: the app picks the file format
# and where the bytes live. Deserializing refuses a database of another version.
serde = ["dep:serde", "tutti-plugin-types/serde"]

[dependencies]
# `ProbeError`: the typed account a failed probe holds (the probe's wire types).
tutti-plugin-types = { version = "0.0.1", path = "../tutti-plugin-types", features = ["probe-wire"] }
# `Reaped`, the guard on the probe's child process, and `HOST_PID_ENV`, how the
# host states its pid to it.
tutti-plugin-ipc-ffi = { version = "0.0.1", path = "../tutti-plugin-ipc-ffi" }
# `Instant`: the probe's deadline.
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }
# `LockExt`, `Tally`: the catalog's lock and the scan's loss count.
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
serde = { version = "1", features = ["derive"], optional = true }
thiserror = { workspace = true, features = ["std"] }
tracing.workspace = true
# The scan's progress and change channels.
crossbeam-channel = "0.5"
# The probe's private result directory (pure Rust; removed on drop, panic included).
tempfile = "3"

[dev-dependencies]
tutti-units = { version = "0.0.1", path = "../tutti-units", default-features = false }
# The format the serde round trip runs through.
serde_json = "1"
# The non-self-describing format the round trip also runs through.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }

# The catalog tests find the reference plugin and `plugin-probe` beside the test
# binary; the plugin is a dev-dependency for its artifact, built by this `cargo test`.
tutti-fixtures = { path = "../../testing/tutti-fixtures", features = ["plugin"] }
tutti-clap-test-plugin = { path = "../../testing/tutti-clap-test-plugin" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

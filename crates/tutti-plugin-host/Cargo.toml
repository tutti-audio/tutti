[package]
name = "tutti-plugin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The format-independent part of plugin hosting in tutti"
readme = "README.md"
license.workspace = true
repository.workspace = true
# Not published, like `tutti-plugin-ipc` and `tutti-plugin-db`: whether and when
# the split goes to crates.io is the maintainer's call.
keywords = ["audio", "plugin", "host"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
# The editor's sizes, which name their unit (`dpi::Size`).
dpi.workspace = true
# The vocabulary, the graph, the transport and the value types. No `tutti-plugin-ipc`, no format
# host, no `tutti-plugin`.
tutti-plugin-types = { version = "0.0.1", path = "../tutti-plugin-types" }
tutti-graph = { version = "0.0.1", path = "../tutti-graph" }
tutti-timeline = { version = "0.0.1", path = "../tutti-timeline" }
tutti-tempo = { version = "0.0.1", path = "../tutti-tempo" }
tutti-units = { version = "0.0.1", path = "../tutti-units" }
tutti-music = { version = "0.0.1", path = "../tutti-music" }
# `monotonic_ns`: the transport's system time.
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
# The sample float the node is generic over, and the width a plugin activates at.
tutti-buffers = { version = "0.0.1", path = "../tutti-buffers" }
# The controller map reads a message through the UMP decode.
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
tutti-midi-protocol = { version = "0.0.1", path = "../tutti-midi-protocol" }
# The one OS look at a plugin's descriptors (`service_now`).
tutti-plugin-ipc-ffi = { version = "0.0.1", path = "../tutti-plugin-ipc-ffi" }

# The in-process node's stack channel tables.
arrayvec = "0.7"
thiserror = { workspace = true, features = ["std"] }
tracing.workspace = true

[dev-dependencies]
# Test reads block on a `ParamRead` (a test may block).
futures-lite.workspace = true
# `fake`: the plugin that implements `Loaded` with no format behind it, which
# the block-status tests drive through `client_over`.
tutti-plugin-types = { path = "../tutti-plugin-types", features = ["testing"] }
# The in-process node's tests and the integration suites load the reference
# VST2 plugin through the format host: the first `InProcess` format, and the one
# whose test plugin the workspace test run always builds.
tutti-vst2-host = { path = "../tutti-vst2-host" }
# `contract::{drive_input, Direct}`: the in-process node driven by hand, as a
# graph drives it, in its tests, allocation gate and bench.
tutti-graph = { path = "../tutti-graph", features = ["contract"] }
# `ControlLaneNode::by_id` and its `ControlProgram`: the control lane that
# drives the in-process plugin's parameters through its event input.
tutti-nodes = { path = "../tutti-nodes", default-features = false, features = ["testing"] }
tutti-modulation = { path = "../tutti-modulation", default-features = false }
criterion.workspace = true
# Finds the reference plugin beside the test binary.
tutti-fixtures = { path = "../../testing/tutti-fixtures", features = ["plugin"] }
assert_no_alloc = { version = "1", default-features = false }
# The reference VST2 plugin the in-process lifecycle tests load, plus
# `libloading` to re-open the image the host loaded and read its capture: the
# linked rlib is a separate image with separate statics, so only the cdylib's
# globals see the host's calls. The same pair, for the same reasons, as
# `tutti-vst2-host`'s dev-dependencies.
libloading.workspace = true
tutti-vst2-test-plugin = { path = "../../testing/tutti-vst2-test-plugin" }

# The in-process node tells a plugin its rate, and forks it, on the process's
# main thread only (`MainThreadMarker::new` asks the OS), which the default harness never
# runs a test on: these targets own `main()` (`tutti_fixtures::main_thread_cases`).
[[test]]
name = "vst2_in_process_params"
path = "tests/vst2_in_process_params.rs"
harness = false

[[test]]
name = "vst2_in_process_rt_lifecycle"
path = "tests/vst2_in_process_rt_lifecycle.rs"
harness = false

[[test]]
name = "vst2_in_process_render_mode"
path = "tests/vst2_in_process_render_mode.rs"
harness = false

[[bench]]
name = "vst2_in_process"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

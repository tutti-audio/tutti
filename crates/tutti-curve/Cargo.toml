[package]
name = "tutti-curve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Easing curves and automation: how a value moves between points over time"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["audio", "automation", "easing"]
categories = ["multimedia::audio"]

[lints]
workspace = true

# No features: a `Law` is a plain `Copy` value. Nothing here persists a curve,
# so there is no `serde`.

[dependencies]
# `Beat`, the position of an automation point.
tutti-units = { version = "0.0.1", path = "../tutti-units" }
# `Law`'s `powf` and `expm1f` and the equal-power fade's `cosf` and `sinf` are
# `libm`'s pure-Rust ones, so a value does not depend on the platform's C math
# library.
libm = "0.2.15"
# The `Error` derive of the crate's error types.
thiserror = { workspace = true }

[dev-dependencies]
tutti-fixtures = { path = "../../testing/tutti-fixtures" }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[package]
name = "tutti-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The name is an unrelated project's on crates.io; publishing is the owner's call.
description = "Shared building blocks for audio code: channel layouts, ids and parameter cells, over typed units"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "units", "real-time"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# `serde` on the unit newtypes.
serde = ["tutti-units/serde"]

[dependencies]
# `Param<U>` wraps an `Arc<AtomicF64>`.
atomic_float = { version = "1.1", default-features = false, features = ["atomic_f64"] }
# The unit newtypes every value here is built from.
tutti-units = { version = "0.0.1", path = "../tutti-units" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

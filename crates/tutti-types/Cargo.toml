[package]
name = "tutti-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The name is an unrelated project's on crates.io; publishing is the owner's call.
description = "Shared building blocks for audio code: channel layouts, musical time, notes and parameter cells, over typed units"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "units", "real-time"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []
# Enables `Serialize`/`Deserialize` on wire-carried value types: `ChannelLayout`
# (which rides the plugin-load IPC reply via `BusChannels`), `ChannelTopology`
# (which rides the same reply once the format hosts report placement) and the
# meter vocabulary (which round-trips through the host's document), with the
# unit newtypes the latter is built from.
serde = ["dep:serde", "tutti-units/serde"]

[dependencies]
# `Param<U>` wraps an `Arc<AtomicF32>` (an `f32` unit) or an `Arc<AtomicF64>`
# (an `f64` unit, `Seconds`).
atomic_float = { version = "1.1", default-features = false, features = ["atomic_f64"] }
# `FrameClock`'s ceiling is `libm`'s pure-Rust `ceil`, so it does not depend on
# the platform's C math library.
libm = "0.2.15"
# The unit newtypes every value here is built from.
tutti-units = { version = "0.0.1", path = "../tutti-units" }
serde = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }
# The `Error` derive of the crate's error types.
thiserror = { workspace = true }

[dev-dependencies]
# The meter `Deserialize` impls are the untrusted-document edge, so they are
# tested against a real format rather than a hand-rolled deserializer.
serde_json = "1"
tutti-fixtures = { path = "../../testing/tutti-fixtures" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

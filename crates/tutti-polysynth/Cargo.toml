[package]
name = "tutti-polysynth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A polyphonic synthesizer with unison, portamento, alternative tunings and per-note expression"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "synthesizer", "polyphony", "mpe", "dsp"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[features]
default = []

[dependencies]
thiserror = { workspace = true, features = ["std"] }

# `Node`, `ForkSource`: the synth as a graph node, and its own way into a
# fork of the graph (an export), as `tutti-plugin`'s `PluginClient` has
# one.
tutti-graph = { version = "0.0.1", path = "../tutti-graph" }

# The SVF and ladder coefficient functions. The voice bank runs those two
# filters' topologies across SIMD lanes and derives its coefficients from the
# same functions `SvfFilterNode`/`LadderFilterNode` use, rather than a copy.
tutti-dsp = { version = "0.0.1", path = "../tutti-dsp", default-features = false }


# The `f32x8` and `f64x4` lanes of the voice bank.
wide = { version = "1.6", default-features = false }

tutti-units = { version = "0.0.1", path = "../tutti-units", default-features = false }
tutti-music = { version = "0.0.1", path = "../tutti-music", default-features = false }
tutti-rt = { version = "0.0.1", path = "../tutti-rt", default-features = false }
# The float the synth is generic over, and the buffer views `Renderer::render_input` takes.
tutti-buffers = { version = "0.0.1", path = "../tutti-buffers" }
# `Law`, the shape of the portamento glide.
tutti-curve = { version = "0.0.1", path = "../tutti-curve" }
tutti-midi-protocol = { version = "0.0.1", path = "../tutti-midi-protocol" }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
tutti-voicing = { version = "0.0.1", path = "../tutti-voicing" }

[dev-dependencies]
# The filter nodes the bank is compared against (`bank.rs`), and the mixing and
# lane nodes of the integration tests.
tutti-nodes = { path = "../tutti-nodes", default-features = false, features = ["testing"] }
# The graph contract's test harness.
tutti-graph = { path = "../tutti-graph", features = ["contract", "testing"] }
criterion.workspace = true
# `check_range_contract`'s serde shape, for `UnisonVoices` and `GlideTime`
# (whose raw is `Seconds`).
serde = "1"
tutti-units = { path = "../tutti-units", default-features = false, features = ["serde"] }
tutti-music = { path = "../tutti-music", default-features = false, features = ["serde"] }
tutti-fixtures = { path = "../../testing/tutti-fixtures" }
assert_no_alloc = { version = "1", default-features = false }
tutti-midi-runtime = { path = "../tutti-midi-runtime", default-features = false }
# `ControlProgram` for the lane tests (`tests/param_lanes.rs`).
tutti-modulation = { path = "../tutti-modulation", default-features = false }

[[bench]]
name = "polysynth"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

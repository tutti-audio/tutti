[package]
name = "tutti-clap-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A host for CLAP audio plugins"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["clap", "audio", "plugin", "dsp", "host"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
# The editor's sizes, which name their unit (`dpi::Size`).
dpi.workspace = true
bitflags = "2"
clap-sys = "0.5"
thiserror = "2"
tracing.workspace = true
tutti-clap-ffi = { version = "0.0.1", path = "../tutti-clap-ffi" }
tutti-midi-protocol = { version = "0.0.1", path = "../tutti-midi-protocol" }
tutti-plugin-types = { version = "0.0.1", path = "../tutti-plugin-types" }
# `FdId`, `Interest` and `Ready`: the typed values of a wait on a plugin's descriptors.
tutti-plugin-ipc-ffi = { version = "0.0.1", path = "../tutti-plugin-ipc-ffi" }
tutti-units = { version = "0.0.1", path = "../tutti-units" }
tutti-music = { version = "0.0.1", path = "../tutti-music" }
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
tutti-voicing = { version = "0.0.1", path = "../tutti-voicing" }
# `Pool`, the worker-pool contract `clap.thread-pool` requests are served on
# (`ClapLoaded::set_thread_pool`). No cycle: `tutti-graph` names only
# `tutti-units`, `tutti-rt` and `tutti-ump`.
tutti-graph = { version = "0.0.1", path = "../tutti-graph" }
# The sample width `Float` and the block view `InputOutput` a block is processed in.
tutti-buffers = { version = "0.0.1", path = "../tutti-buffers" }
# `Instant`, the one clock type; `MainThreadMarker`, the token the threading conformance suite makes.
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }

[dev-dependencies]
# `MainThreadMarker`: the token the threading conformance suite makes.
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }
# The README's editor example takes any `raw-window-handle` window.
raw-window-handle = "0.6"
tutti-clap-ffi = { path = "../tutti-clap-ffi", features = ["testing"] }
# `mapping_contract!`: the laws `ParamBounds` is held to.
tutti-plugin-types = { path = "../tutti-plugin-types", features = ["contract", "testing"] }
# The integration tests re-open the reference plugin's library themselves (the
# crate forbids `unsafe`; a test may use it).
libloading.workspace = true
# The track colour a test names (`rgb::RGBA8`).
rgb.workspace = true
# Finds the reference plugins and the plugin-server beside the test binary.
tutti-fixtures = { path = "../../testing/tutti-fixtures", features = ["plugin"] }
assert_no_alloc = { version = "1", default-features = false }
# The test collects the `tutti::plugin` events the host emits.
tracing-subscriber.workspace = true
# The reference plugin used by the clap_conformance harness. As a
# dev-dependency, Cargo builds its cdylib in the same `cargo test`
# invocation (no nested cargo / no target-dir-lock deadlock); the rlib
# side gives the test the `ProcessCapture` type directly. The test finds the
# cdylib beside its own binary (`tutti-fixtures`) and dlopens it.
tutti-clap-test-plugin = { path = "../../testing/tutti-clap-test-plugin" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

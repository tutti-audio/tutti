[package]
name = "tutti-plugin-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The helper program that runs one plugin in its own process for tutti"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["audio", "plugin", "vst3", "clap", "sandbox"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[[bin]]
name = "plugin-server"
path = "src/main.rs"

[features]
default = ["vst3", "clap", "au"]

# VST3 support
vst3 = ["dep:tutti-vst3-host"]

# CLAP support
clap = ["dep:tutti-clap-host"]

# Audio Unit support (macOS only)
au = ["dep:tutti-au-host"]

[dependencies]
# The wire, the shared-memory slab and the state chunking: the process edge's
# other end (the host's is the same crate).
tutti-plugin-ipc = { version = "0.0.1", path = "../tutti-plugin-ipc" }
# The editor's sizes, which name their unit (`dpi::Size`).
dpi.workspace = true
# The plugin vocabulary: the capability traits the formats implement, the
# lifecycle, and the bundle-layout walk (`bundle::any_module_in_bundle`).
tutti-plugin-types = { version = "0.0.1", path = "../tutti-plugin-types" }
# The sample width of the served pipeline's channels (`Float`) and the block views.
tutti-buffers = { version = "0.0.1", path = "../tutti-buffers", features = ["serde"] }

# `spawn_named`, `request_priority`, `with_no_denormals`: the server's render and control threads.
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
tutti-graph = { version = "0.0.1", path = "../tutti-graph" }

# Cross-platform local IPC (Unix sockets on Unix, named pipes on Windows)
interprocess = { version = "2" }

# The error of a command the render thread does not take.
thiserror = { workspace = true, features = ["std"] }

# Logging
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# CLAP plugin hosting (optional)
tutti-clap-host = { version = "0.0.1", path = "../tutti-clap-host", optional = true }

# VST3 plugin hosting (optional)
tutti-vst3-host = { version = "0.0.1", path = "../tutti-vst3-host", optional = true }

# The OS calls of the host watchdog and the connection wait, behind safe calls.
tutti-plugin-ipc-ffi = { version = "0.0.1", path = "../tutti-plugin-ipc-ffi" }

# `ParamId`, in the served plugin's parameter calls.
tutti-units = { version = "0.0.1", path = "../tutti-units" }

[target.'cfg(target_os = "macos")'.dependencies]
# Audio Unit hosting (optional, macOS only): `au` enables nothing elsewhere.
tutti-au-host = { version = "0.0.1", path = "../tutti-au-host", optional = true }

[dev-dependencies]
# `at_frame` and `unit_value`: the parameter points the tests build.
tutti-plugin-types = { path = "../tutti-plugin-types", features = ["testing"] }
tutti-midi-protocol = { path = "../tutti-midi-protocol" }
# Finds the reference plugins and the plugin-server beside the test binary.
tutti-fixtures = { path = "../../testing/tutti-fixtures", features = ["plugin"] }
# RT-safety regression: prove the per-block audio path never allocates.
assert_no_alloc = { version = "1", default-features = false }
# The reference CLAP plugin the loader tests drive. A dev-dependency rather
# than a build-time artifact so cargo builds the cdylib as part of the same
# `cargo test` invocation (one target-dir lock, no nested cargo), and the
# tests find it beside the test binary. This is what lets the CLAP suite run on any
# machine instead of naming an absolute macOS path.
tutti-clap-test-plugin = { path = "../../testing/tutti-clap-test-plugin", features = ["probe"] }
# The same `tutti-vst3-host` the `vst3` feature pulls in, but with `conformance`
# on so its build script compiles `audio-probe` — the reference VST3 plugin the
# loader tests drive, the counterpart to `tutti-clap-test-plugin` above. As a
# *dev*-dependency the feature does not reach production builds: `conformance`
# also exposes a `pub mod` observation seam that should stay off there.
#
# Cargo unifies this with the optional dependency, so the probe is built
# whenever tests run with `--features vst3`, and its location arrives as
# `DEP_TUTTI_VST3_PROBE_DIR` (see build.rs).
tutti-vst3-host = { path = "../tutti-vst3-host", features = ["conformance"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[target.'cfg(unix)'.dev-dependencies]
# `orphan_watchdog`'s and `load_reply`'s process control (`kill`, `waitpid`, `prctl`).
libc = "0.2"
# `load_reply`: the log of a server whose host ends.
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The AU loader's transport test pulls the host-callback procs through
# `TransportState::test_pull`, which `tutti-au-ffi` keeps behind `testing`.
tutti-au-host = { path = "../tutti-au-host", features = ["testing"] }

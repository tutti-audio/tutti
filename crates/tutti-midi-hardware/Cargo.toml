[package]
name = "tutti-midi-hardware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MIDI device input and output through CoreMIDI on macOS, ALSA on Linux and Windows Multimedia on Windows, for tutti"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["midi", "ump", "audio", "real-time"]
categories = ["multimedia::audio", "hardware-support"]

[features]
# `Serialize`/`Deserialize` on `MidiHardwareConfig` and `InputTiming`.
serde = ["dep:serde", "tutti-ump/serde"]
# Exports `test_support::FakeBackend`, a device list with no OS behind it.
testing = []
# The suites that need a real ALSA sequencer (`/dev/snd/seq`); Linux only. They
# stand in for devices through `tutti-alsa-ffi`'s `testing` hooks.
sequencer-tests = ["tutti-alsa-ffi/testing"]
# The suites that open Windows' GS Wavetable Synth, which needs an audio
# endpoint; Windows only.
synth-tests = []

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true, features = ["std"] }
serde = { version = "1", optional = true, features = ["derive"] }
tracing.workspace = true
getrandom = { workspace = true }

tutti-midi-device = { version = "0.0.1", path = "../tutti-midi-device" }
tutti-midi-ci = { version = "0.0.1", path = "../tutti-midi-ci" }
tutti-graph = { version = "0.0.1", path = "../tutti-graph" }
tutti-midi-runtime = { version = "0.0.1", path = "../tutti-midi-runtime", default-features = false }
tutti-units = { version = "0.0.1", path = "../tutti-units", default-features = false }
# `spawn_named`: the port threads.
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
tutti-midi-protocol = { version = "0.0.1", path = "../tutti-midi-protocol" }



[target.'cfg(target_os = "linux")'.dependencies]
tutti-alsa-ffi = { version = "0.0.1", path = "../tutti-alsa-ffi" }

[target.'cfg(target_os = "macos")'.dependencies]
tutti-coremidi-ffi = { version = "0.0.1", path = "../tutti-coremidi-ffi" }

[target.'cfg(windows)'.dependencies]
tutti-winmm-ffi = { version = "0.0.1", path = "../tutti-winmm-ffi" }

[dev-dependencies]
tutti-midi-hardware = { path = ".", features = ["testing"] }
tutti-buffers = { path = "../tutti-buffers" }

serde_json = "1"
assert_no_alloc = { version = "1", default-features = false }
tutti-fixtures = { path = "../../testing/tutti-fixtures", features = ["graph"] }

[package.metadata.docs.rs]
all-features = true

# macOS 15's UMP Endpoint with Function Blocks is a main-thread object: this target
# owns `main()`, which is the process's main thread under cargo (the default
# harness runs each test on a worker thread). `tutti_fixtures::main_thread_cases`
# answers nextest's command line.
[[test]]
name = "virtual_blocks"
path = "tests/virtual_blocks/main.rs"
harness = false

# The API layer: the cross-crate composition. `tutti` depends on it.
#
# Not an umbrella: it re-exports no crate whole (`cargo xtask check-session`
# fails on `pub use tutti_x as …;`, `pub use tutti_x;` and
# `pub use tutti_x::*;`), only the single items its own signatures take.
[package]
name = "tutti-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "One object holding an audio graph, a playback clock and optionally a sound device: the entry point to tutti"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["audio", "real-time", "engine", "daw"]
categories = ["multimedia::audio"]

[lints]
workspace = true

[dependencies]
# The editor's sizes, which name their unit (`dpi::Size`); the editor is `plugin`'s.
dpi = { workspace = true, optional = true }
tutti-buffers = { version = "0.0.1", path = "../tutti-buffers" }
# Always: the graph, the engine and transport, the vocabulary, and the nodes
# the builder inserts (the click) and modulation applies (`Modulation`).
tutti-units = { version = "0.0.1", path = "../tutti-units", default-features = false }
tutti-music = { version = "0.0.1", path = "../tutti-music", default-features = false }
atomic_float = "1.1"
tutti-ump = { version = "0.0.1", path = "../tutti-ump", default-features = false }
tutti-graph = { version = "0.0.1", path = "../tutti-graph" }
tutti-timeline = { version = "0.0.1", path = "../tutti-timeline" }
# The project's tempo map, which a bounce's range and clock are derived from.
tutti-tempo = { version = "0.0.1", path = "../tutti-tempo" }
tutti-engine = { version = "0.0.1", path = "../tutti-engine" }
# `MainThreadMarker`, `monotonic_ns`, `spawn_named`: the session's main-thread proof, system clock and worker threads.
tutti-platform = { version = "0.0.1", path = "../tutti-platform" }
# `Publisher` for the tests that publish.
tutti-rt = { version = "0.0.1", path = "../tutti-rt" }
tutti-nodes = { version = "0.0.1", path = "../tutti-nodes", default-features = false }
thiserror = { workspace = true, features = ["std"] }
# `oneshot`: the reply of a file load, an out-of-process plugin load, and a MIDI-CI peer request;
# every feature that gates `unblocked`, `plugin::load` or `midi_ci` takes it.
futures-channel = { workspace = true, optional = true }
# `FutureExt::catch_unwind`: a take's pump reports its panic as its end.
futures-lite = { workspace = true, optional = true }
tracing.workspace = true
serde = { version = "1", optional = true, features = ["derive"] }

# The sound card. Off: offline only, and no ALSA headers needed.
tutti-cpal = { version = "0.0.1", path = "../tutti-cpal", default-features = false, optional = true }
tutti-modulation = { version = "0.0.1", path = "../tutti-modulation", default-features = false }
# The analyses `Session::analyze` runs (`Measure`, `Meter`).
tutti-measure = { version = "0.0.1", path = "../tutti-measure", optional = true }
# `MpeMode`, the session builder's one MPE setting.
tutti-midi-protocol = { version = "0.0.1", path = "../tutti-midi-protocol", optional = true }
tutti-midi-runtime = { version = "0.0.1", path = "../tutti-midi-runtime", default-features = false, optional = true }
tutti-midi-file = { version = "0.0.1", path = "../tutti-midi-file", optional = true }
tutti-midi-hardware = { version = "0.0.1", path = "../tutti-midi-hardware", default-features = false, optional = true }
# The device vocabulary (`MidiDeviceId`, `DeviceInfo`, ...) the OS MIDI layer reports in,
# and the `MediaType` a peer's saved state names its encoding by.
tutti-midi-device = { version = "0.0.1", path = "../tutti-midi-device", optional = true }
tutti-midi-ci = { version = "0.0.1", path = "../tutti-midi-ci", optional = true }
tutti-sampler = { version = "0.0.1", path = "../tutti-sampler", default-features = false, optional = true }
tutti-soundfont = { version = "0.0.1", path = "../tutti-soundfont", optional = true }
# The font `load_soundfont` parses (`tutti-soundfont` does not re-export it).
tutti-sf2 = { version = "0.0.1", path = "../tutti-sf2", optional = true }
tutti-export = { version = "0.0.1", path = "../tutti-export", default-features = false, optional = true }
# `DecodeError` (in `Error::Decode`, whatever decoders are on) and `Format`,
# the file format a bounce names (`Bounce::format`). No codec feature.
tutti-codec = { version = "0.0.1", path = "../tutti-codec" }
# The `DitherShape` an `IntPcm` names, and the `Lerp` and `SimdLanes` bounds of the
# General MIDI setup and the SoundFont unit in any float.
tutti-dsp = { version = "0.0.1", path = "../tutti-dsp", default-features = false, optional = true }
tutti-plugin = { version = "0.0.1", path = "../tutti-plugin", optional = true }
# The control handle, the node's controls and the host policy over a handle
# (`Liveness`, `PluginParamValues`): what a hosted plugin is, whatever serves it.
tutti-plugin-host = { version = "0.0.1", path = "../tutti-plugin-host", optional = true }
# The catalog a plugin load resolves through (`Loadable`, `Hosting`, `tutti_plugin_db::BindError`).
tutti-plugin-db = { version = "0.0.1", path = "../tutti-plugin-db", optional = true }
# The bridge settings a plugin opens with (`AudioConfig`).
tutti-plugin-ipc = { version = "0.0.1", path = "../tutti-plugin-ipc", optional = true }
# `MainThreadMarker`, the proof `Editor` holds, and the editor vocabulary.
tutti-plugin-types = { version = "0.0.1", path = "../tutti-plugin-types", optional = true }
# `HasWindowHandle`, the parent a view embeds an editor into (`Editor::open`).
raw-window-handle = { version = "0.6", optional = true }

# Network MIDI 2.0 over UDP: no sockets on the web, so the dependency is native only
# and the feature does nothing there (`midi_network_none.rs`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tutti-midi-network = { version = "0.0.1", path = "../tutti-midi-network", optional = true }

[features]
# Every subsystem is a feature, as on every engine crate.
default = []
device = ["dep:tutti-cpal"]
# The pump loop, device-free: a host that records files or
# taps without a microphone takes it alone.
record = ["dep:tutti-dsp"]
# Live audio input from the sound card: `Session::add_input`, takes, mic capture;
# implies `device` and `record`.
capture = ["device", "record", "tutti-cpal/capture", "encode-wav", "dep:futures-lite"]
midi = [
    "dep:futures-channel",
    "dep:tutti-midi-protocol",
    "dep:tutti-midi-runtime",
    "dep:tutti-midi-file",
]
# Network MIDI 2.0: a Client or a Host as MIDI input and output over UDP (native targets).
midi-network = ["midi", "dep:tutti-midi-network", "dep:tutti-midi-device"]
midi-hardware = ["midi", "dep:tutti-midi-hardware", "dep:tutti-midi-device", "dep:tutti-midi-ci"]
# The OS MIDI backends of `tutti-midi-hardware`, each a no-op off its OS. Without one,
# `midi-hardware` lists no device. `winmm` is not a default: it replaces `midi-services` on
# Windows, so only the app turns it on.
alsa = ["tutti-midi-hardware?/alsa"]
coremidi = ["tutti-midi-hardware?/coremidi"]
midi-services = ["tutti-midi-hardware?/midi-services"]
winmm = ["tutti-midi-hardware?/winmm"]
# `serde` for `MidiRouteRule<T>` (keyed by the app's own stable id, not a
# `NodeKey`): its Group and channel are `tutti-ump`'s, with its `serde`; and for
# `PeerState`, whose plugin and device are `tutti-plugin`'s and `tutti-midi-device`'s.
serde = [
    "midi",
    "dep:serde",
    "tutti-ump/serde",
    "tutti-plugin?/serde",
    "tutti-plugin-types?/serde",
    "tutti-midi-device?/serde",
    "tutti-midi-ci?/serde",
]
sampler = ["dep:tutti-sampler", "dep:futures-channel"]
# `Session::analyze`: an offline analysis job over a wave or a file.
analyze = ["dep:tutti-measure", "dep:futures-channel"]
soundfont = ["midi", "dep:tutti-soundfont", "dep:tutti-sf2", "dep:tutti-dsp"]
# The polysynth suites and benches (a dev-dependency); the library names no synth.
synth = ["midi"]
# Export. `export` is the offline renderer and WAV, which is pure Rust; FLAC and
# AIFF are pure Rust and opt-in (`encode-flac`, `encode-aiff`).
export = ["dep:tutti-export", "dep:tutti-dsp", "dep:futures-channel", "encode-wav"]
# The encoders `tutti-codec` writes, under the codec's own names; none implies `export`.
encode-wav = ["tutti-codec/encode-wav"]
encode-flac = ["tutti-codec/encode-flac"]
encode-aiff = ["tutti-codec/encode-aiff"]
plugin = [
    "dep:dpi",
    "dep:futures-channel",
    "dep:tutti-plugin",
    "dep:tutti-plugin-db",
    "dep:tutti-plugin-host",
    "dep:tutti-plugin-ipc",
    "dep:tutti-plugin-types",
    "dep:tutti-midi-device",
    "dep:tutti-midi-ci",
    "dep:raw-window-handle",
    "midi",
]
vst2 = ["plugin", "tutti-plugin/vst2"]
vst3 = ["plugin", "tutti-plugin/vst3"]
clap = ["plugin", "tutti-plugin/clap"]
au = ["plugin", "tutti-plugin/au"]
# What a test reads of the graph's plumbing (`Graph::testing`, `take_audio_side`,
# `AudioSide`). Off by default; this crate's own tests turn it on through the
# dev-dependency on itself below, as `tutti-graph` does.
testing = ["tutti-cpal?/testing"]

[dev-dependencies]
tutti-polysynth = { version = "0.0.1", path = "../tutti-polysynth" }
# Test reads block on a `ParamRead` (a test may block).
futures-lite.workspace = true
# Turns `testing` on for this crate's own tests, benches and doctests.
tutti-session = { path = ".", features = ["testing"] }
# The `FakeBackend` the hot-plug tests drive (`plug`, `unplug`). Dev-only:
# `midi-hardware` must not link a fake backend.
tutti-midi-hardware = { path = "../tutti-midi-hardware", features = ["testing"] }
# The Freeverb bank whose reported tail a bounce test reads as its figure.
tutti-dsp = { path = "../tutti-dsp", default-features = false }
# Stimulus nodes (`Const`, `Osc`, `Through`) for the tests and doctests.
tutti-nodes = { path = "../tutti-nodes", default-features = false, features = ["testing"] }
# The in-memory tone a sampler voice test plays (`Wave`).
tutti-codec = { path = "../tutti-codec", features = ["encode-wav", "decode-wav", "decode-flac"] }
# The collector that reads the `tutti::graph` events a session emits
# (`tests/io/rt_log.rs`).
tracing-subscriber.workspace = true
# An independent reader for the WAV files the pump tests write.
hound = "3.5"
# `MidiRouteRule`'s serde round trip (`tests/midi/midi_front.rs`).
serde_json = "1"
# `testing`'s hand-stepped streamer, and the WAV reader the disk voice's
# fork reads its file with (`export_fork_sampler`).
tutti-sampler = { path = "../tutti-sampler", default-features = false, features = ["testing"] }
# `ManualStreamDriver`, `OutputSpec`: the device-free device tests.
tutti-cpal = { path = "../tutti-cpal", default-features = false }
# The reference CLAP plugin `tests/plugin/plugin.rs` loads, in a
# `plugin-server` (built first: `cargo build -p tutti-plugin-server`; it is
# not a dev-dependency, which would be a cycle through `tutti-plugin`).
tutti-clap-test-plugin = { path = "../../testing/tutti-clap-test-plugin", features = ["probe"] }
# `PluginEntry`: a scanned plugin, which `PluginRef::from` reads (`plugin_identity`).
tutti-plugin-db = { path = "../tutti-plugin-db" }
# The reference VST2 plugin the `vst2_*` suites load in process (`vst2`), and
# `libloading` re-opens the image the host loaded to read what it captured and
# to flip its switches: the linked rlib is a separate image with separate
# statics. The same pair, for the same reason, as `tutti-plugin`'s.
tutti-vst2-test-plugin = { path = "../../testing/tutti-vst2-test-plugin" }
libloading.workspace = true
# Finds both beside the running binary (`tests/support`).
tutti-fixtures = { path = "../../testing/tutti-fixtures", features = ["plugin"] }
# `FakePlugin` and its `FakeLoaded` control: a hosted plugin whose editor a test
# scripts (`src/plugin/fake_hosting/main_view.rs`).
tutti-plugin-types = { path = "../tutti-plugin-types", features = ["testing"] }
# The shared test plugin the instrument contract hosts in `Notes` mode, and
# the font its SoundFont subject plays.
tutti-shared-plugin = { path = "../../testing/tutti-shared-plugin" }
assert_no_alloc = { version = "1", default-features = false }
# The directory a cancelled export's file is looked for in (`tests/export/export_cancel.rs`).
tempfile = "3.10"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Plugins hosted in this process, through the session, on the process's main thread:
# `MainThreadMarker::new` asks the OS, so the target owns `main()` (`harness = false`).
[[test]]
name = "main_thread"
harness = false
required-features = ["plugin"]

# The shared plugin hosted in this process and bounced: a fork of an in-process plugin is
# made on the process's main thread, so the target owns `main()` (`harness = false`).
[[test]]
name = "bounce_in_process"
harness = false
required-features = ["clap", "export"]

# The instrument contract (`tests/instrument/instrument_support`): the same cases
# against `PolySynth`, the SoundFont unit and a hosted plugin. The plugin subject
# needs a built `plugin-server`, and fails without it.
[[test]]
name = "instrument"
required-features = ["synth", "soundfont", "clap"]

# Each block's load against its deadline, on a heavy scene of the engine's
# own nodes, serial and on the pool: a percentile harness, not criterion.
[[bench]]
name = "render_load"
harness = false
required-features = ["synth", "sampler", "midi"]

# The §5.1 and §5.2 examples are the umbrella's (`crates/tutti/examples`):
# they import from `tutti`'s root, which this crate cannot name.

# A steady-state update's cost with modulation declared: a percentile
# harness, not criterion (`benches/mod_update.rs`).
[[bench]]
name = "mod_update"
harness = false

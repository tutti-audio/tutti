[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/tutti",
    "crates/tutti-session",
    "testing/tutti-verify",
    "testing/tutti-book",
    "crates/tutti-engine",
    "crates/tutti-timeline",
    "crates/tutti-tempo",
    "crates/tutti-curve",
    # The sample formats (`Sample`, `Float`, `I24`) and the borrowed mono, interleaved
    # and planar views over them, with the conversions between formats and layouts:
    # layer 1, `tutti-units` alone (and `libm`). It also holds the channel family: `ChannelLayout`,
    # `ChannelTopology`, `Speaker`, `MaxBlock`.
    "crates/tutti-buffers",
    "crates/tutti-cpal",
    "crates/tutti-units",
    "crates/tutti-music",
    "crates/tutti-codec",
    "crates/tutti-platform",
    "crates/tutti-rt",
    "crates/tutti-ump",
    "crates/tutti-midi-protocol",
    "crates/tutti-voicing",
    # MIDI-CI: the codec, `CiDevice`, the initiators, Property Exchange and the profile tables.
    "crates/tutti-midi-ci",
    "crates/tutti-midi-device",
    # Network MIDI 2.0 over UDP: the wire format, the Client and Host session
    # machines (no sockets), a `std::net` driver and mDNS discovery.
    # Depends on `tutti-ump`, `tutti-midi-ci` and `tutti-midi-device` alone.
    "crates/tutti-midi-network",
    "crates/tutti-graph",
    "crates/tutti-modulation",
    "crates/tutti-export",
    "crates/tutti-alsa-ffi",
    "crates/tutti-coremidi-ffi",
    "crates/tutti-winmm-ffi",
    "crates/tutti-midi-hardware",
    "crates/tutti-midi-file",
    "crates/tutti-midi-runtime",
    "crates/tutti-sampler",
    "crates/tutti-polysynth",
    "crates/tutti-soundfont",
    "crates/tutti-nodes",
    "crates/tutti-dsp",
    "crates/tutti-measure",
    "crates/tutti-plugin-ipc-ffi",
    "crates/tutti-plugin-ipc",
    "crates/tutti-plugin-host",
    "crates/tutti-plugin",
    "crates/tutti-plugin-server",
    "crates/tutti-plugin-probe",
    "crates/tutti-plugin-types",
    "crates/tutti-plugin-db",
    "crates/tutti-vst3-host",
    "crates/tutti-clap-ffi",
    "crates/tutti-au-ffi",
    "crates/tutti-vst3-ffi",
    "crates/tutti-clap-host",
    "crates/tutti-au-host",
    "crates/tutti-vst2-host",
    "crates/tutti-vst2-ffi",
    "testing/tutti-vst2-test-plugin",
    "testing/tutti-vst2-shell-plugin",
    "testing/tutti-vst2-author",
    "testing/tutti-fixtures",
    "crates/tutti-sf2",
    "testing/tutti-clap-test-plugin",
    "testing/tutti-shared-plugin",
    "testing/tutti-shared-plugin-vst3-cpp",
    "testing/tutti-plugin-contract",
    # SOFA to tutti HRIR sphere converter: an offline tool, reads AES69 files.
    "testing/tutti-hrir-convert",
    # Fuzz targets over the public decoders and parsers (`cargo xtask fuzz`).
    "testing/tutti-fuzz",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
# The pinned toolchain's minor (`rust-toolchain.toml`); the two move together.
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tutti-audio/tutti"

# A doc link breaks silently when its target goes private (rustdoc renders it
# as plain text), so both are errors.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

# `cfg(loom)` (the loom models) and `cfg(docsrs)` (docs.rs) are set from outside
# the build, so they are declared here for every member.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(docsrs)'] }
missing_docs = "warn"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[workspace.dependencies]
thiserror = { version = "2", default-features = false }
# `tutti-platform`'s `Executor`: the run queue, and the `Task` a spawn returns.
async-executor = "1.14.1"
async-task = "4.7.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
libloading = "0.9"
# The features both Windows FFI crates need; each adds its own.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
# `std` stays on: without it `dpi` calls `libm`, which it does not depend on.
dpi = "0.1.2"
keyboard-types = { version = "0.8.3", default-features = false }
rgb = { version = "0.8.53", default-features = false }

# Pure-Rust HDF5 reader and writer: the SOFA (AES69) container of
# `tutti-hrir-convert`.
hdf5-pure = "0.48.0"

# `html_reports` is an empty feature in criterion 0.8; the HTML report comes
# from its default `plotters` feature.
criterion = "0.8"

winnow = { version = "1", default-features = false, features = ["alloc", "binary"] }
# SHA-256 for Network MIDI 2.0's invitation digests (`tutti-midi-network`'s auth module).
sha2 = { version = "0.11.1", default-features = false }
# The operating system's random bytes, for a Host's authentication nonce.
getrandom = "0.4.3"
# mDNS / DNS-SD service advertisement and browsing, `tutti-midi-network`'s discovery module alone.
mdns-sd = "0.21.7"
# NFC composition for text written into UMP messages (M2-104 section 1.8).
unicode-normalization = { version = "0.1", default-features = false }
# CoreMIDI's C API (`tutti-coremidi-ffi`'s ports, endpoints and clients) and the
# objc2 bindings below, which reach the UMP endpoint classes.
coremidi-sys = "3.2"
core-foundation = "0.10"
# The Objective-C blocks CoreMIDI and AudioUnit callbacks take, and the Mach clock.
block2 = "0.6"
mach2 = "0.7"
objc2 = { version = "0.6", default-features = false, features = ["std", "exception"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSException", "NSObjCRuntime", "NSString"] }
objc2-core-midi = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "MIDIMessages", "MIDIServices", "MIDIUMPCI", "MIDIUMPEndpoint", "MIDIUMPEndpointManager", "MIDIUMPFunctionBlock"] }

# Release codegen with line tables, for a sampling profiler:
#   cargo build -p tutti-nodes --profile profiling --bench engine_render
#   samply record target/profiling/build/tutti-nodes/<hash>/out/engine_render-<hash> --bench
# Cargo reads `[profile]` only in the root manifest, so profiles live here.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

# Line tables only: a backtrace keeps file and line, and codegen, linking and
# disk use shrink. Dependencies carry no debuginfo. `test` inherits all of it.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# `aeffect_params` compares function addresses across crates, which holds only
# when nothing is optimized, so this crate stays at opt-level 0.
[profile.dev.package.tutti-vst2-author]
opt-level = 0

